<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>Gearwise Checkliste</title>
    <style>
      :root {
        --bg: #f7f6f3; --surface: #ffffff; --text: #17181b; --muted: #6c7078; --border: #e7e5e0;
        --brand: #a3e635; --done: #3d7a2a; color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #131314; --surface: #1b1b1d; --text: #ededeb; --muted: #9b9c9e; --border: #2a2a2d; --done: #8cc36b; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 400 17px/1.45 "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
      main { max-width: 640px; margin: 0 auto; padding: 0 0 40px; }
      header { padding: 20px 20px 18px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 2; }
      section, footer { padding: 18px 20px 8px; }
      section + section, footer { border-top: 1px solid var(--border); }
      .brand { margin: 0; font-size: 14px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
      .brand img { border-radius: 5px; }
      h1 { margin: 12px 0 2px; font-size: 21px; line-height: 1.25; font-weight: 650; letter-spacing: -.015em; overflow-wrap: anywhere; }
      h2 { margin: 0 0 4px; font-size: 13px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
      .facts { margin: 0 0 6px; color: var(--muted); font-variant-numeric: tabular-nums; }
      a { color: var(--text); font-weight: 600; text-underline-offset: 3px; }
      .note { color: var(--muted); font-size: 14px; margin: 4px 0 8px; }
      ul { list-style: none; margin: 0; padding: 0; }
      li + li { border-top: 1px solid var(--border); }
      label { display: flex; gap: 14px; align-items: flex-start; padding: 12px 0; cursor: pointer; min-height: 48px; }
      input[type=checkbox] { appearance: none; -webkit-appearance: none; width: 24px; height: 24px; flex: none; margin: 0; border: 1.75px solid var(--muted); border-radius: 7px; display: grid; place-content: center; background: var(--surface); }
      input[type=checkbox]::after { content: ""; width: 11px; height: 6px; border: solid var(--bg); border-width: 0 0 2.5px 2.5px; transform: rotate(-45deg) translate(1px, -1px); opacity: 0; }
      input[type=checkbox]:checked { background: var(--done); border-color: var(--done); }
      input[type=checkbox]:checked::after { opacity: 1; border-color: #fff; }
      input:checked + span { color: var(--muted); text-decoration: line-through; }
      .progress { height: 6px; border-radius: 999px; background: var(--border); overflow: hidden; margin-top: 12px; }
      #bar { height: 100%; width: 0; background: var(--brand); transition: width .2s; }
      .rule { font-weight: 650; margin: 0 0 12px; }
      .reset { font: inherit; font-size: 15px; height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
      @media (prefers-reduced-motion: reduce) { #bar { transition: none; } }
    </style>
  </head>
  <body>
    <main id="app"><header><p class="brand"><img src="../logo.svg" alt="" width="20" height="20" />Gearwise</p><h1>Checkliste wird geladen …</h1></header></main>
    <script src="check.js"></script>
  </body>
</html>
